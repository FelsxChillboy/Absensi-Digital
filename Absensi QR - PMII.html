<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Absensi QR</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
:root{
  --bg:#F7F6F2; --surface:#FFFFFF; --text:#1C1A17; --muted:#6B675F;
  --accent:#2F5D4F; --accent-text:#FFFFFF; --border:#E3E0D8; --danger:#A3432F;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15140F; --surface:#1F1D17; --text:#EDEAE1; --muted:#A39E8F;
    --accent:#6FA98E; --accent-text:#13241D; --border:#33301F; --danger:#E0876E;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15140F; --surface:#1F1D17; --text:#EDEAE1; --muted:#A39E8F;
  --accent:#6FA98E; --accent-text:#13241D; --border:#33301F; --danger:#E0876E;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family: 'Georgia', 'Times New Roman', serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
header{
  padding:20px 16px 12px; border-bottom:1px solid var(--border);
  background:var(--bg); position:sticky; top:0; z-index:5;
}
h1{margin:0 0 4px; font-size:1.3rem; font-weight:600}
.sub{color:var(--muted); font-size:.85rem; margin:0}
nav{display:flex; gap:8px; margin-top:14px}
nav button{
  font-family:inherit; border:1px solid var(--border); background:var(--surface); color:var(--text);
  padding:8px 14px; border-radius:6px; cursor:pointer; font-size:.9rem;
}
nav button.active{background:var(--accent); color:var(--accent-text); border-color:var(--accent)}
main{max-width:720px; margin:0 auto; padding:20px 16px 60px}
.card{background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:16px; margin-bottom:14px}
.peserta-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:14px}
.peserta-item{background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:14px; text-align:center}
.peserta-item .qr{display:flex; justify-content:center; margin-bottom:8px}
.peserta-item .nama{font-size:.85rem; font-weight:600; margin-bottom:2px}
.peserta-item .kode{font-size:.78rem; color:var(--muted)}
label{display:block; font-size:.82rem; color:var(--muted); margin-bottom:4px}
input[type=text]{
  width:100%; padding:9px 10px; border-radius:6px; border:1px solid var(--border);
  background:var(--bg); color:var(--text); font-family:inherit; font-size:.9rem;
}
button.primary{
  font-family:inherit; background:var(--accent); color:var(--accent-text); border:none;
  padding:10px 16px; border-radius:6px; cursor:pointer; font-size:.9rem; margin-top:10px;
}
#reader{width:100%; max-width:380px; margin:0 auto; border-radius:8px; overflow:hidden}
#scan-status{margin-top:14px; padding:12px; border-radius:6px; font-size:.9rem; display:none}
#scan-status.ok{display:block; background:rgba(111,169,142,.15); border:1px solid var(--accent); color:var(--text)}
#scan-status.err{display:block; background:rgba(224,135,110,.15); border:1px solid var(--danger); color:var(--text)}
.log{margin-top:16px; font-size:.82rem; color:var(--muted)}
.log div{padding:4px 0; border-bottom:1px solid var(--border)}
@media print{
  header,nav,.no-print{display:none !important}
  main{padding:0; max-width:none}
  .peserta-grid{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>
<header>
  <h1>Absensi QR</h1>
  <p class="sub">Generate kode peserta &amp; catat kehadiran ke Google Sheet</p>
  <nav class="no-print">
    <button id="nav-generate">Generate QR</button>
    <button id="nav-scan">Scan Absensi</button>
  </nav>
</header>
<main>
  <div id="view-generate">
    <div class="card no-print">
      <button class="primary" onclick="window.print()">Cetak semua QR</button>
    </div>
    <div class="peserta-grid" id="peserta-grid"></div>
  </div>

  <div id="view-scan" style="display:none">
    <div class="card no-print">
      <label>URL Web App Apps Script</label>
      <input type="text" id="endpoint" placeholder="https://script.google.com/macros/s/.../exec">
      <button class="primary" id="save-endpoint">Simpan URL</button>
    </div>
    <div class="card">
      <div id="reader"></div>
      <div id="scan-status"></div>
      <div class="log" id="log"></div>
    </div>
  </div>
</main>

<script>
const peserta = [
  {id:"REG-001", nama:"PC PMII Jakarta Timur"},
  {id:"REG-002", nama:"PC PMII Jakarta Selatan"},
  {id:"REG-003", nama:"PC PMII Jakarta Barat"},
  {id:"REG-004", nama:"PC PMII Jakarta Pusat"},
  {id:"REG-005", nama:"PC PMII Jakarta Utara"},
  {id:"REG-006", nama:"PKC DKI JAKARTA"},
  {id:"REG-007d", nama:"PAN-PEL"}
];

const grid = document.getElementById('peserta-grid');
peserta.forEach(p=>{
  const item = document.createElement('div');
  item.className='peserta-item';
  const qrDiv = document.createElement('div');
  qrDiv.className='qr';
  item.appendChild(qrDiv);
  const nama = document.createElement('div'); nama.className='nama'; nama.textContent=p.nama;
  const kode = document.createElement('div'); kode.className='kode'; kode.textContent=p.id;
  item.appendChild(nama); item.appendChild(kode);
  grid.appendChild(item);
  new QRCode(qrDiv, {text:p.id, width:120, height:120});
});

// nav
const navGen = document.getElementById('nav-generate');
const navScan = document.getElementById('nav-scan');
const viewGen = document.getElementById('view-generate');
const viewScan = document.getElementById('view-scan');
let scannerStarted = false;

function showView(name){
  if(name==='scan'){
    viewGen.style.display='none'; viewScan.style.display='block';
    navScan.classList.add('active'); navGen.classList.remove('active');
    startScanner();
  } else {
    viewScan.style.display='none'; viewGen.style.display='block';
    navGen.classList.add('active'); navScan.classList.remove('active');
  }
  location.hash = name==='scan' ? 'scan' : 'generate';
}
navGen.onclick=()=>showView('generate');
navScan.onclick=()=>showView('scan');

// endpoint storage
let endpointUrl = '';
try{ endpointUrl = localStorage.getItem('absensi-endpoint') || ''; }catch(e){}
document.getElementById('endpoint').value = endpointUrl;
document.getElementById('save-endpoint').onclick=()=>{
  endpointUrl = document.getElementById('endpoint').value.trim();
  try{ localStorage.setItem('absensi-endpoint', endpointUrl); }catch(e){}
  setStatus('URL endpoint disimpan.','ok');
};

function setStatus(msg,type){
  const el = document.getElementById('scan-status');
  el.textContent = msg; el.className = type;
}
function addLog(msg){
  const log = document.getElementById('log');
  const row = document.createElement('div');
  row.textContent = msg;
  log.prepend(row);
}

async function kirimAbsensi(id){
  if(!endpointUrl){ setStatus('Isi dulu URL Web App Apps Script di atas.','err'); return; }
  const p = peserta.find(x=>x.id===id);
  const nama = p ? p.nama : '(tidak dikenal)';
  try{
    const res = await fetch(endpointUrl + '?id=' + encodeURIComponent(id) + '&nama=' + encodeURIComponent(nama));
    const text = await res.text();
    setStatus(nama + ' (' + id + ') — ' + text, 'ok');
    addLog(new Date().toLocaleTimeString() + ' — ' + nama + ' (' + id + ')');
  }catch(err){
    setStatus('Gagal mengirim data: cek URL / koneksi.', 'err');
  }
}

function startScanner(){
  if(scannerStarted) return;
  scannerStarted = true;
  const qr = new Html5Qrcode('reader');
  qr.start({facingMode:'environment'}, {fps:10, qrbox:220},
    (decodedText)=>{ kirimAbsensi(decodedText.trim()); },
    ()=>{}
  ).catch(()=>{ setStatus('Tidak bisa mengakses kamera.', 'err'); });
}

// initial route
if(location.hash.replace('#','')==='scan'){ showView('scan'); } else { showView('generate'); }
</script>
</body>
</html>
